name: Build, Deploy and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty for auto-increment.'
        required: false
        type: string

# 并发控制：同一 ref 上的多次推送只保留最新一次构建，避免重复打包 300MB+ 离线包
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 构建只跑一次，产物 html.zip 通过 artifact 共享给下游两个 job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Ensure offline assets
        run: |
          if [ ! -d public/vendor ]; then
            echo "::error::缺少 public/vendor，请确认离线资源已提交。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package build output
        run: zip -r html.zip html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-zip
          path: html.zip
          if-no-files-found: error

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: html-zip

      - name: Unzip site
        run: unzip -q html.zip -d site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/html

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: html-zip

      - name: Determine tag
        id: tag
        # 通过 env 传值，避免 workflow_dispatch 输入直接拼进 shell 造成脚本注入
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "RELEASE_TAG=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_TAG=release-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: Release ${{ steps.tag.outputs.RELEASE_TAG }}
          body: |
            Auto-built from commit ${{ github.sha }}.
            Download `html.zip`, extract and deploy to any static server.
            Note: full offline bundle (fonts + sdkjs) makes the zip large (~300MB+ compressed).
          files: html.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
